<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani Login Page</title>
</head>

<body>

    <div class="signup">
        <a href="#">Sign up</a>
    </div>

    <main class="login-container">

        <!-- Left login section -->
        <section class="login-panel">

            <div class="logo">
                <div class="logo-icon">◉</div>
                <div class="logo-text">
                    سیلانی</span><span>Saylani</span>
                </div>
            </div>

            <h2>Log into your Account</h2>

            <form class="login-form" id="loginForm">

                <div class="input-box">
                    <span class="icon">✉</span>
                    <input type="email" placeholder="iamchis_walloce@email.com" aria-label="Email address" required>
                </div>

                <div class="input-box">
                    <span class="icon">♙</span>
                    <input type="password" id="password" placeholder="Password" aria-label="Password" required>
                    <span class="eye" id="togglePassword">◉</span>
                </div>

                <a href="#" class="forgot">Forgot Password?</a>

                <button type="submit" class="sign-in">
                    Sign in
                </button>

            </form>

            <div class="separator">or</div>

            <div class="social-login">

                <button type="button" class="social-btn">
                    <span class="google">G</span>
                    Sign in with Google
                </button>

                <button type="button" class="social-btn">
                    <span class="facebook">f</span>
                    Sign in with Facebook
                </button>

                <button type="button" class="social-btn">
                    <span class="apple"></span>
                    Sign in with Apple
                </button>

            </div>

            <p class="create-account">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </section>

        <!-- Right image section -->
        <section class="image-panel" aria-label="Study desk photograph">
        </section>

    </main>



</body>

</html>
